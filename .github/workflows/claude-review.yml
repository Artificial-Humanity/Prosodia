name: Janis — PR Review

# ⚠ STOOD DOWN 2026-08-10 (owner) — NOT DELETED, and not broken.
#
# The Janis/Quincy review lane is being piloted in **Sonora only**, which is the most
# active repo at this phase and therefore where the process earns or loses its keep. It
# demonstrably improves code quality — it has caught real defects that reading alone
# missed — but it also adds real friction, and running it across four repos multiplies
# that before we know the shape we actually want.
#
# HOW IT IS OFF: the automatic triggers are removed, leaving `workflow_dispatch` so the
# lane can still be run by hand from the Actions tab. Nothing is deleted, no secret
# changed, no app uninstalled. To re-arm, restore the trigger block below and delete this
# banner — one edit, no archaeology.
#
# ⚠ THE PR-ONLY RULE IS UNAFFECTED. Branch protection on `main` and the AGENTS.md commit
# policy are a SEPARATE decision and both still stand here. This switch turns off the
# BOTS, not the review.
#
# Original triggers, kept verbatim so re-arming is a copy:
#   on:
#     pull_request:
#       types: [opened, synchronize]

on:
  workflow_dispatch:

# `synchronize` fires on EVERY push to an open PR. Without this group, three
# quick pushes run three concurrent reviews and you are billed for all three
# while only the last one is worth reading.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip bot-initiated runs — CLEANLY, rather than letting the action refuse them.
    #
    # `synchronize` fires on every push to an open PR, and the fix pass pushes. So
    # Quincy's commits re-trigger this review, the action sees a non-human actor and
    # fails the job: "Workflow initiated by non-human actor ... Add bot to allowed_bots".
    # Taking that suggestion would re-enable exactly the oscillation the fix lane is
    # label-gated to prevent (fix pushes -> review -> fix -> ...), billed in full each
    # lap. Skipping is also the intended design: Quincy answers and resolves each
    # finding in its own thread, so a whole-PR re-review after a fix pass was never
    # wanted. A red X for working-as-designed is noise that trains you to ignore the
    # check.
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest

    # REQUIRED — not optional boilerplate. This repo's default workflow token is
    # read-only (`default_workflow_permissions: "read"`, checked 2026-08-10), so
    # without this block the review runs to completion, bills the tokens, and
    # then cannot post a single comment. The failure is silent in the sense that
    # the analysis succeeds; only the delivery fails.
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Review Agent
        uses: anthropics/claude-code-action@v1
        with:
          # The INPUT name is fixed by the action (`claude_code_oauth_token`);
          # the SECRET is the org-level `CLAUDE_OAUTH_TOKEN`. These deliberately
          # do not match — do not "fix" the left side to agree with the right.
          claude_code_oauth_token: ${{ secrets.CLAUDE_OAUTH_TOKEN }}

          # --allowedTools is what actually lets the agent reach GitHub. Without
          # it the model can analyze the diff but has no mechanism to post, so a
          # prompt asking for "inline comments" produces nothing. This is the
          # second half of the permissions problem above: permissions grant the
          # token the right, --allowedTools grants the agent the tool.
          #
          # `--effort` is deliberately absent: it is not a documented claude_args
          # flag, and Claude Code already defaults to xhigh effort on capable
          # models, so naming it buys nothing and risks failing on an unknown arg.
          claude_args: >-
            --model claude-opus-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are an elite, pedantic Senior Code Reviewer. Review this pull
            request's diff thoroughly, focusing on architectural flaws,
            edge-case logic bugs, security vulnerabilities, and performance
            bottlenecks.


            IDENTITY — you are **Janis**, the reviewer. Both agents post from the same
            `claude[bot]` GitHub account, so the ONLY way a reader can tell your voice
            from the fixer's is that you label it. Begin every comment you post — the
            top-level review and every inline comment — with exactly:

              🔍 **Janis** · review

            on its own line, then a blank line, then the content. Never omit it, and
            never use Quincy's badge: a misattributed comment is worse than an unlabelled
            one, because it sends the reader to the wrong agent's reasoning.

            Report every issue that could cause incorrect behavior, a test
            failure, a security weakness, or a misleading result — including
            findings you are uncertain about. Give each one an explicit
            severity so it can be triaged. Only omit pure nits: formatting,
            naming preferences, and style that no reader would act on.
            Do not filter beyond that bar — a qualitative instruction like
            "only report important issues" is followed literally and silently
            drops real bugs.

            The PR branch is already checked out in the working directory.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for findings anchored to specific lines.
            Only post GitHub comments — do not return the review as a chat
            message, or nobody will ever see it.

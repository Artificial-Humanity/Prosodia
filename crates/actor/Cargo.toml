[package]
name = "actor"
version = "0.1.0"
edition = "2021"

[dependencies]
uniffi = "0.27"
stage = { path = "../stage" }
serde_json = "1"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
regex = "1.10"
once_cell = "1.19"
# Exact: the fold's OVERRIDES are what this version gets wrong (device_g2p/fold.rs).
deunicode = "=1.6.2"
flate2 = "1"

[dev-dependencies]
sha2 = "0.10"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
